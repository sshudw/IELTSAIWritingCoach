spring.application.name=ielts-ai-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ielts_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:500ms}

ai.api-url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
ai.api-key=${DEEPSEEK_API_KEY:}
ai.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
ai.feedback-language=${AI_FEEDBACK_LANGUAGE:Chinese}
ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:60}


evaluation.worker.enabled=${EVALUATION_WORKER_ENABLED:true}
evaluation.worker.poll-delay-ms=${EVALUATION_WORKER_POLL_DELAY_MS:1000}
evaluation.worker.initial-delay-ms=${EVALUATION_WORKER_INITIAL_DELAY_MS:1000}

evaluation.redis.max-requests-per-minute=${EVALUATION_REDIS_MAX_REQUESTS_PER_MINUTE:5}
evaluation.redis.dedup-ttl=${EVALUATION_REDIS_DEDUP_TTL:30s}
